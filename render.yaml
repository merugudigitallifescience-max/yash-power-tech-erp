# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# Uses the Supabase database (no Render database, so nothing expires after 30 days).
# Free plan sleeps after 15 min idle; upgrade the service to Starter ($7/mo) to keep it always on.
services:
  - type: web
    name: yash-power-tech-erp
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL   # Supabase Session pooler, without the password
        value: postgresql://postgres.tycxlymvsjoiqvgqpxlf@aws-1-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require
      - key: DB_PASSWORD
        sync: false         # you type your Supabase database password when creating the Blueprint
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE
        value: db
      - key: COOKIE_SECURE
        value: "true"
      - key: MAX_UPLOAD_MB
        value: "20"
